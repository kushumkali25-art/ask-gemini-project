<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Gemini</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Ask Gemini</h1>
    <p class="subtitle">Type any question and get an AI-generated answer</p>
    <form id="ask-form">
      <input type="text" id="question-input" placeholder="Ask any question here" autocomplete="off" />
      <button type="submit" id="submit-btn">Ask</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <div id="answer-box" class="answer-box hidden"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
